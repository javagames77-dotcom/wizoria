<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizoria — Supervisor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
/* Кольорові токени -- скопійовано 1:1 з ТЗ. За замовчуванням СВІТЛА тема
   (так у вас відкривається сам файл ТЗ), тому тут беремо саме
   [data-theme="light"] значення з Wizoria___Технічне_завдання_Mystery_Shopper.html */
:root{
  --accent:#8C64C9;--accent-hover:#a07ed8;--accent-light:rgba(140,100,201,.13);--accent-border:rgba(140,100,201,.3);
  --bg:#f4f4f7;--bg2:#ffffff;--bg3:#f0f0f4;--bg4:#e8e8ef;
  --text:#1a1a20;--muted:#6b6b80;--muted2:#aaaabc;--black:#0a0a12;
  --border:#e0e0e8;--border2:#ccccda;
  --success:#16a34a;--success-bg:#f0fff4;--success-border:#bbf7d0;
  --danger:#c0392b;--danger-bg:#fff0f0;--danger-border:#ffd0d0;
  --warn-text:#92400e;--warn-bg:#fffbeb;--warn-border:#fde68a;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}

/* панель токена -- НЕ з ТЗ, технічна заглушка тестування (немає екрана логіну в цій фазі) */
.token-bar{background:var(--bg3);border-bottom:1px solid var(--border2);padding:8px 16px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.token-bar input{flex:1;max-width:380px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 8px;font-size:11px;font-family:monospace}
.token-bar button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer}

.view{display:none}
.view.active{display:block}
.frame{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2)}
.frame-bar{height:30px;background:var(--bg3);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px}
.frame-dot{width:9px;height:9px;border-radius:50%}

.card-plain{margin-bottom:8px}
.spec-list{list-style:none;padding:0;margin:0}
.spec-item{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text);line-height:1.6;margin-bottom:8px}
.spec-check{width:17px;height:17px;border-radius:5px;background:var(--accent-light);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.spec-check svg{width:9px;height:9px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.quote-btn{background:none;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px}
.eye-btn{border:0.5px solid var(--border);border-radius:5px;height:26px;padding:0 8px;display:inline-flex;align-items:center;font-size:11px;color:var(--muted);gap:4px;cursor:pointer;background:none}

.empty-state{padding:24px;text-align:center;color:var(--muted);font-size:12px}
.loading{padding:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<div class="token-bar">
  <span>Base URL:</span><input id="baseUrlInput" style="max-width:300px">
  <span>Bearer:</span><input id="tokenInput" placeholder="токен supervisor'а (з /ga/auth/login)">
  <button onclick="saveAuthAndReload()">Застосувати</button>
</div>

<!-- ══════════════════════════════════════════════
     ЕКРАН 1: СПИСОК ПЕРЕВІРОК (1:1 з ТЗ, section-label
     "Веб-інтерфейс Supervisor — список перевірок", рядки 1643-1805)
════════════════════════════════════════════════ -->
<div class="view active" id="view-reviews" style="padding:16px">

  <div class="frame">
    <div class="frame-bar">
      <div class="frame-dot" style="background:#ff6058"></div>
      <div class="frame-dot" style="background:#ffbe2e"></div>
      <div class="frame-dot" style="background:#2ac940"></div>
      <div style="flex:1;height:16px;background:var(--bg2);border-radius:3px;margin:0 12px;border:0.5px solid var(--border)"></div>
    </div>
    <div style="display:flex">
      <!-- Sidebar (1:1) -->
      <div style="width:190px;min-width:190px;border-right:0.5px solid var(--border);padding:12px 0;background:var(--bg3)">
        <div style="padding:8px 14px 12px;border-bottom:0.5px solid var(--border);margin-bottom:8px">
          <div style="font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Supervisor</div>
        </div>
        <div style="padding:7px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px"><i class="ti ti-clipboard-list" style="font-size:14px"></i> Завдання</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:7px;background:var(--accent-light);border-left:2px solid var(--accent)"><i class="ti ti-file-search" style="font-size:14px"></i> Перевірки</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer" onclick="showView('shoppers')"><i class="ti ti-user-check" style="font-size:14px"></i> Покупці <span id="pendingBadge" style="margin-left:auto;background:var(--warn-bg);color:var(--warn-text);font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;border:0.5px solid var(--warn-border);display:none">0</span></div>
      </div>
      <!-- Main -->
      <div style="flex:1;padding:16px;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div>
            <div style="font-size:14px;font-weight:500;color:var(--black)">Перевірки</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px" id="reviewsDate">—</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <div style="display:flex;gap:10px;font-size:11px;color:var(--muted);align-items:center">
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;flex-shrink:0"></span>Розбіжність AI</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--warn-text);display:inline-block;flex-shrink:0"></span>Мінуси</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;flex-shrink:0"></span>Авто-схвалено</span>
            </div>
            <div style="border:0.5px solid var(--border);border-radius:5px;height:28px;padding:0 10px;display:flex;align-items:center;font-size:11px;color:var(--muted);gap:5px;cursor:pointer;position:relative" onclick="toggleFilterPopup()">
              <i class="ti ti-filter" style="font-size:13px"></i> Фільтр
              <div id="filterPopup" style="display:none;position:absolute;top:32px;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px;z-index:10;min-width:140px">
                <div class="filter-opt" data-v="" style="padding:6px 8px;font-size:11px;color:var(--text);cursor:pointer;border-radius:5px">Усі рішення</div>
                <div class="filter-opt" data-v="pending" style="padding:6px 8px;font-size:11px;color:var(--text);cursor:pointer;border-radius:5px">Очікують</div>
                <div class="filter-opt" data-v="approved" style="padding:6px 8px;font-size:11px;color:var(--text);cursor:pointer;border-radius:5px">Схвалено</div>
                <div class="filter-opt" data-v="rejected" style="padding:6px 8px;font-size:11px;color:var(--text);cursor:pointer;border-radius:5px">Відхилено</div>
              </div>
            </div>
          </div>
        </div>
        <div id="reviewsTableWrap"><div class="loading">Завантаження…</div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--muted);padding:0 4px" id="reviewsSummary"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     ЕКРАН 2: ДЕТАЛЬНИЙ ПЕРЕГЛЯД ЗВІТУ (1:1 з ТЗ, section-label
     "Веб-інтерфейс Supervisor — перегляд звіту", рядки 1329-1448)
════════════════════════════════════════════════ -->
<div class="view" id="view-detail" style="padding:16px">
  <div class="frame">
    <div class="frame-bar">
      <div class="frame-dot" style="background:#ff6058"></div>
      <div class="frame-dot" style="background:#ffbe2e"></div>
      <div class="frame-dot" style="background:#2ac940"></div>
      <div style="flex:1;height:16px;background:var(--bg2);border-radius:3px;margin:0 12px;border:0.5px solid var(--border)"></div>
    </div>
    <div style="display:flex">
      <!-- Sidebar (1:1, включно з "← Всі звіти" -- саме так підписано в цьому екрані ТЗ) -->
      <div style="width:190px;min-width:190px;border-right:0.5px solid var(--border);padding:12px 0;background:var(--bg3)">
        <div style="padding:8px 14px 12px;border-bottom:0.5px solid var(--border);margin-bottom:8px">
          <div style="font-size:10px;font-weight:500;color:var(--accent);margin-bottom:4px;cursor:pointer" onclick="showView('reviews')">← Всі звіти</div>
        </div>
        <div style="font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);padding:0 14px;margin-bottom:4px">Supervisor</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px"><i class="ti ti-clipboard-list" style="font-size:14px"></i> Завдання</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:7px;background:var(--accent-light);border-left:2px solid var(--accent)"><i class="ti ti-file-search" style="font-size:14px"></i> Звіти</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px"><i class="ti ti-user-check" style="font-size:14px"></i> Покупці</div>
      </div>
      <!-- Main -->
      <div style="flex:1;padding:16px" id="detailContent"><div class="loading">Завантаження…</div></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     ЕКРАН 3: ВЕРИФІКАЦІЯ ПОКУПЦІВ (1:1 з ТЗ, section-label
     "Верифікація нових покупців", рядки 1808-1897)
════════════════════════════════════════════════ -->
<div class="view" id="view-shoppers" style="padding:16px">
  <div class="frame">
    <div class="frame-bar">
      <div class="frame-dot" style="background:#ff6058"></div>
      <div class="frame-dot" style="background:#ffbe2e"></div>
      <div class="frame-dot" style="background:#2ac940"></div>
      <div style="flex:1;height:16px;background:var(--bg2);border-radius:3px;margin:0 12px;border:0.5px solid var(--border)"></div>
    </div>
    <div style="display:flex">
      <div style="width:190px;min-width:190px;border-right:0.5px solid var(--border);padding:12px 0;background:var(--bg3)">
        <div style="padding:7px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer" onclick="showView('reviews')"><i class="ti ti-file-search" style="font-size:14px"></i> Перевірки</div>
        <div style="padding:7px 14px;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:7px;background:var(--accent-light);border-left:2px solid var(--accent)">
          <i class="ti ti-user-check" style="font-size:14px"></i> Покупці
          <span id="pendingBadge2" style="margin-left:auto;background:var(--warn-bg);color:var(--warn-text);font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;border:0.5px solid var(--warn-border);display:none">0</span>
        </div>
      </div>
      <div style="flex:1;padding:16px;min-width:0">
        <div style="font-size:14px;font-weight:500;color:var(--black);margin-bottom:14px">Нові заявки на верифікацію</div>
        <div id="shoppersWrap"><div class="loading">Завантаження…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// Auth (панель токена -- НЕ з ТЗ, технічна заглушка тестування)
// ============================================================
let BASE_URL = 'https://primary-production-4b93e.up.railway.app/webhook';
let TOKEN = '';
document.getElementById('baseUrlInput').value = BASE_URL;

function saveAuthAndReload(){
  BASE_URL = document.getElementById('baseUrlInput').value.trim();
  TOKEN = document.getElementById('tokenInput').value.trim();
  loadReviews();
  loadShoppers();
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}, {'Authorization':'Bearer '+TOKEN});
  const res = await fetch(BASE_URL + path, Object.assign({}, opts, {headers}));
  let data;
  try{ data = await res.json(); }catch(e){ data = {success:false, error:'Невалідна відповідь сервера'}; }
  return {ok: res.ok, status: res.status, data};
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function truncate(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }

// ============================================================
// ЕКРАН 1: Перевірки (1:1 розмітка рядків з ТЗ)
// ============================================================
let allSubmissions = [];
let activeFilter = '';

document.addEventListener('click', function(e){
  if(!e.target.closest('#filterPopup') && !e.target.closest('[onclick="toggleFilterPopup()"]')){
    document.getElementById('filterPopup').style.display = 'none';
  }
});
function toggleFilterPopup(){
  const p = document.getElementById('filterPopup');
  p.style.display = p.style.display==='block' ? 'none' : 'block';
}
document.querySelectorAll('.filter-opt').forEach(el=>{
  el.addEventListener('click', ()=>{ activeFilter = el.dataset.v; document.getElementById('filterPopup').style.display='none'; renderReviews(); });
  el.addEventListener('mouseenter', ()=>el.style.background='var(--bg3)');
  el.addEventListener('mouseleave', ()=>el.style.background='transparent');
});

async function loadReviews(){
  document.getElementById('reviewsTableWrap').innerHTML = '<div class="loading">Завантаження…</div>';
  const r = await api('/ga/supervisor/submissions');
  if(!r.data.success){
    document.getElementById('reviewsTableWrap').innerHTML = '<div class="empty-state">Помилка: '+escapeHtml(r.data.error||'невідома')+'. Перевірте токен вгорі.</div>';
    return;
  }
  allSubmissions = r.data.submissions;
  document.getElementById('reviewsDate').textContent = new Date().toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'});
  renderReviews();
}

// Рядок таблиці -- 1:1 з розміткою кожного з 3 кольорових варіантів у ТЗ (danger-bg / warn-bg / без фону)
function reviewRow(s){
  const time = s.submitted_at ? new Date(s.submitted_at).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '—';

  let rowBg = ''; // green / not-yet-analyzed -- без фону, як у ТЗ
  if(s.color === 'red') rowBg = 'background:var(--danger-bg)';
  if(s.color === 'yellow') rowBg = 'background:var(--warn-bg)';

  const scoreColor = s.color==='red' ? 'var(--danger)' : (s.color==='yellow' ? 'var(--warn-text)' : (s.color==='green' ? 'var(--success)' : 'var(--muted)'));
  const scoreTxt = s.ai_score === null ? '—' : s.ai_score;

  // Флаги -- один чіп-лейбл + один чіп-приклад деталі на тип, 1:1 стиль з ТЗ (кольори danger/warn)
  let flagsCell = '';
  if(s.flags && s.flags.length){
    const byType = {};
    s.flags.forEach(f=>{ (byType[f.flag_type]=byType[f.flag_type]||[]).push(f); });
    const meta = {
      ai_mismatch: {label:'Розбіжність AI', icon:'ti-alert-triangle', bg:'var(--danger-bg)', fg:'var(--danger)', bd:'var(--danger-border)'},
      anomaly: {label:'Аномалія', icon:'ti-alert-triangle', bg:'var(--danger-bg)', fg:'var(--danger)', bd:'var(--danger-border)'},
      negative_answers: {label:'мінус(и) в анкеті', icon:'ti-minus', bg:'var(--warn-bg)', fg:'var(--warn-text)', bd:'var(--warn-border)'}
    };
    flagsCell = '<div style="display:flex;gap:5px;flex-wrap:wrap">';
    Object.keys(byType).forEach(type=>{
      const m = meta[type] || {label:type, icon:'ti-flag', bg:'var(--bg3)', fg:'var(--muted)', bd:'var(--border)'};
      const list = byType[type];
      const label = type==='negative_answers' ? (list.length+' '+m.label) : m.label;
      flagsCell += `<span style="display:inline-flex;align-items:center;gap:3px;background:${m.bg};color:${m.fg};border:0.5px solid ${m.bd};border-radius:4px;padding:2px 6px;font-size:10px;font-weight:500"><i class="ti ${m.icon}" style="font-size:11px"></i> ${escapeHtml(label)}</span>`;
      flagsCell += `<span style="background:${m.bg};color:${m.fg};border:0.5px solid ${m.bd};border-radius:4px;padding:2px 6px;font-size:10px">${escapeHtml(truncate(list[0].details||'',40))}</span>`;
    });
    flagsCell += '</div>';
  } else if(s.color==='green'){
    flagsCell = `<span style="display:inline-flex;align-items:center;gap:3px;background:var(--success-bg);color:var(--success);border:0.5px solid var(--success-border);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:500"><i class="ti ti-circle-check" style="font-size:11px"></i> Авто-схвалено</span>`;
  } else {
    // AI-перевірка ще не прогонялась для цього submission -- випадок, якого немає в мокапі ТЗ
    flagsCell = `<span style="color:var(--muted);font-size:11px">AI ще не перевіряв</span>`;
  }

  let actionCell;
  if(s.decision==='approved' || s.decision==='rejected'){
    const lbl = s.decision==='approved' ? 'Схвалено' : 'Відхилено';
    actionCell = `<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
      <span style="font-size:11px;color:var(--muted)">${lbl}</span>
      <div class="eye-btn" onclick="openDetail(${s.submission_id})"><i class="ti ti-eye" style="font-size:12px"></i> Переглянути</div>
    </div>`;
  } else {
    const borderCol = s.color==='red' ? 'var(--danger-border)' : (s.color==='yellow' ? 'var(--warn-border)' : 'var(--border)');
    const textCol = s.color==='red' ? 'var(--danger)' : (s.color==='yellow' ? 'var(--warn-text)' : 'var(--muted)');
    actionCell = `<div style="display:flex;align-items:center;justify-content:flex-end">
      <div class="eye-btn" style="border-color:${borderCol};color:${textCol}" onclick="openDetail(${s.submission_id})"><i class="ti ti-eye" style="font-size:12px"></i> Переглянути</div>
    </div>`;
  }

  return `<tr style="border-bottom:0.5px solid var(--border);${rowBg}">
    <td style="padding:10px 10px"><div style="font-weight:500;color:var(--black)">${escapeHtml(s.object_name)}</div><div style="font-size:10px;color:var(--muted)">${escapeHtml(s.section_title||'—')}</div></td>
    <td style="padding:10px 10px;color:var(--muted)">${escapeHtml(s.shopper_name)}</td>
    <td style="padding:10px 10px;color:var(--muted)">${time}</td>
    <td style="padding:10px 10px;text-align:center;font-weight:500;color:${scoreColor}">${scoreTxt}</td>
    <td style="padding:10px 10px">${flagsCell}</td>
    <td style="padding:10px 10px;text-align:right">${actionCell}</td>
  </tr>`;
}

function renderReviews(){
  let rows = allSubmissions;
  if(activeFilter) rows = rows.filter(s => (s.decision||'pending') === activeFilter);

  const needAttention = allSubmissions.filter(s=>s.color==='red'||s.color==='yellow').length;
  const autoApproved = allSubmissions.filter(s=>s.color==='green').length;
  document.getElementById('reviewsSummary').innerHTML =
    `<span>${needAttention} потребують уваги · ${autoApproved} авто-схвалено</span><span>Всього: ${allSubmissions.length} перевірок</span>`;

  if(!rows.length){
    document.getElementById('reviewsTableWrap').innerHTML = '<div class="empty-state">Немає перевірок за цим фільтром.</div>';
    return;
  }

  let html = `<table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed"><thead>
    <tr style="border-bottom:1px solid var(--border)">
      <th style="text-align:left;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:22%">Об'єкт / секція</th>
      <th style="text-align:left;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:13%">Покупець</th>
      <th style="text-align:left;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:8%">Час</th>
      <th style="text-align:center;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:8%">AI скор</th>
      <th style="text-align:left;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:33%">Флаги</th>
      <th style="text-align:right;padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted2);width:16%">Дія</th>
    </tr></thead><tbody>`;
  rows.forEach(s=>{ html += reviewRow(s); });
  html += '</tbody></table>';
  document.getElementById('reviewsTableWrap').innerHTML = html;
}

// ============================================================
// ЕКРАН 2: Детальний перегляд (1:1 двоколонкова розмітка з ТЗ)
// ============================================================
let currentDetail = null;

async function openDetail(submissionId){
  showView('detail');
  document.getElementById('detailContent').innerHTML = '<div class="loading">Завантаження…</div>';
  const r = await api('/ga/supervisor/submission-detail?submission_id='+submissionId);
  if(!r.data.success){
    document.getElementById('detailContent').innerHTML = '<div class="empty-state">Помилка: '+escapeHtml(r.data.error||'невідома')+'</div>';
    return;
  }
  currentDetail = r.data;
  renderDetail();
}

function renderDetail(){
  const d = currentDetail;
  const s = d.submission;
  const audio = (d.audio||[])[0];

  // Критерії -- рядки таблиці 1:1 з ТЗ (3 колонки: Критерій / Оцінка / Цитата з аудіо).
  // ТЗ показує тільки один yes/no-бейдж "Оцінка" -- показуємо тут результат AI (він і є тим,
  // що визначає підсумкову оцінку критерію), а не окремо ще й відповідь шоппера
  let criteriaRows = '';
  (d.criteria||[]).forEach(c=>{
    let badge;
    if(c.ai_result === 'yes'){
      badge = `<span style="font-size:10px;background:var(--success-bg);color:var(--success);padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-check" style="font-size:11px"></i> Так</span>`;
    } else if(c.ai_result === 'no'){
      badge = `<span style="font-size:10px;background:var(--danger-bg);color:var(--danger);padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-x" style="font-size:11px"></i> Ні</span>`;
    } else {
      badge = `<span style="font-size:10px;color:var(--muted)">—</span>`;
    }
    const quote = c.ai_quote && c.ai_quote.trim()
      ? `<button class="quote-btn" onclick='openQuote(${JSON.stringify(c).replace(/'/g,"&#39;")})' style="color:var(--muted)">${escapeHtml(c.ai_quote)}</button>`
      : `<span style="font-style:italic;color:var(--muted)">— не зафіксовано</span>`;
    criteriaRows += `<tr>
      <td style="padding:8px 10px;font-size:12px;border-bottom:0.5px solid var(--border);color:var(--text)">${escapeHtml(c.question_text)}${c.mismatch?' <i class=\"ti ti-alert-triangle\" style=\"color:var(--danger);font-size:11px\" title=\"Розбіжність з відповіддю покупця\"></i>':''}</td>
      <td style="padding:8px 10px;font-size:12px;border-bottom:0.5px solid var(--border)">${badge}</td>
      <td style="padding:8px 10px;font-size:11px;border-bottom:0.5px solid var(--border);color:var(--muted)">${quote}</td>
    </tr>`;
  });

  let photosHtml = '';
  (d.photos||[]).forEach(p=>{
    photosHtml += `<div style="flex:1;border-radius:7px;overflow:hidden;border:0.5px solid var(--accent-border);cursor:pointer" title="${escapeHtml(p.title)}">
      <img src="${escapeHtml(p.file_url)}" style="width:100%;height:64px;object-fit:cover;display:block">
    </div>`;
  });
  if(!photosHtml){
    photosHtml = `<div style="flex:1;height:64px;border-radius:7px;background:var(--accent-light);border:0.5px solid var(--accent-border);display:flex;align-items:center;justify-content:center"><i class="ti ti-photo-off" style="font-size:22px;color:var(--accent)"></i></div>`;
  }

  // Кнопки рішення -- рівно 2, як намальовано в ТЗ (Схвалити / Відхилити)
  let actionButtons;
  if(s.decision === 'approved'){
    actionButtons = `<div style="height:28px;background:var(--success-bg);border:0.5px solid var(--success-border);border-radius:5px;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--success)"><i class="ti ti-check" style="font-size:13px"></i> Схвалено</div>`;
  } else if(s.decision === 'rejected'){
    actionButtons = `<div style="height:28px;background:var(--danger-bg);border:0.5px solid var(--danger-border);border-radius:5px;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--danger)"><i class="ti ti-x" style="font-size:13px"></i> Відхилено</div>`;
  } else {
    actionButtons = `
      <div style="height:28px;background:var(--success-bg);border:0.5px solid var(--success-border);border-radius:5px;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--success);cursor:pointer" onclick="submitDecision('approved')"><i class="ti ti-check" style="font-size:13px"></i> Схвалити</div>
      <div style="height:28px;background:var(--danger-bg);border:0.5px solid var(--danger-border);border-radius:5px;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--danger);cursor:pointer" onclick="submitDecision('rejected')"><i class="ti ti-x" style="font-size:13px"></i> Відхилити</div>`;
  }

  const aiSummaryText = s.ai_summary
    ? escapeHtml(s.ai_summary)
    : '<span style="color:var(--muted)">Текстовий AI-висновок по цій секції ще не зберігається в базі окремо (є лише числовий скор і цитати по кожному критерію в таблиці нижче).</span>';

  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div>
        <div style="font-size:14px;font-weight:500;color:var(--black)">${escapeHtml(s.object_name)} — ${escapeHtml(s.section_title||'—')}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px">
          ${escapeHtml(s.shopper_name)} · ${s.submitted_at ? new Date(s.submitted_at).toLocaleDateString('uk-UA') : '—'} · ${s.submitted_at ? new Date(s.submitted_at).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '—'}
          <span style="display:flex;align-items:center;gap:3px;color:var(--accent)"><i class="ti ti-map-pin" style="font-size:12px"></i> ${s.geo_method ? escapeHtml(s.geo_method.toUpperCase())+' зафіксовано' : '—'}</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="display:inline-flex;align-items:baseline;gap:3px;padding:4px 10px;border-radius:6px;background:var(--accent-light);border:0.5px solid var(--accent-border)">
          <span style="font-size:18px;font-weight:500;color:var(--accent)">${s.ai_score===null?'—':s.ai_score}</span>
          <span style="font-size:11px;color:var(--muted)">/100 AI</span>
        </div>
        ${actionButtons}
      </div>
    </div>
    <div style="display:flex;gap:16px">
      <div style="flex:1.6">
        <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">AI висновок</div>
        <div style="background:var(--accent-light);border:0.5px solid var(--accent-border);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--text);line-height:1.6;margin-bottom:14px">${aiSummaryText}</div>
        <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Критерії оцінювання</div>
        <table style="width:100%;border-collapse:collapse;table-layout:fixed">
          <thead><tr>
            <th style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);width:38%">Критерій</th>
            <th style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);width:16%">Оцінка</th>
            <th style="font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);width:46%">Цитата з аудіо</th>
          </tr></thead>
          <tbody>${criteriaRows}</tbody>
        </table>
      </div>
      <div style="flex:1">
        <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Аудіозапис</div>
        <div style="height:38px;border:0.5px solid var(--border);border-radius:7px;background:var(--bg3);display:flex;align-items:center;gap:10px;padding:0 12px;margin-bottom:14px">
          ${audio ? `<audio id="mainAudio" controls style="width:100%;height:32px" src="${escapeHtml(audio.file_url)}"></audio>` : `<span style="font-size:11px;color:var(--muted)">Аудіозапис відсутній</span>`}
        </div>
        <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Діалог (при кліку на цитату)</div>
        <div id="dialogPanel" style="border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px">
          <div style="padding:8px 12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;min-height:60px">Клікніть на цитату зліва, щоб побачити діалог</div>
        </div>
        <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Фото-докази</div>
        <div style="display:flex;gap:8px">${photosHtml}</div>
      </div>
    </div>
  `;
}

async function submitDecision(decision){
  const r = await api('/ga/supervisor/decision', {method:'POST', body: JSON.stringify({
    submission_id: currentDetail.submission.submission_id, decision
  })});
  if(!r.data.success){ alert('Помилка: '+(r.data.error||'невідома')); return; }
  await loadReviews();
  openDetail(currentDetail.submission.submission_id);
}

// Клік по цитаті -- заповнює праву панель "Діалог", 1:1 стиль бульбашок з ТЗ (персонал/клієнт)
function openQuote(criterion){
  const audio = (currentDetail.audio||[])[0];
  let body = `<div style="padding:8px 12px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:11px;font-weight:500;color:var(--black)">${escapeHtml(currentDetail.submission.section_title||'')} — повний діалог</span>
  </div>`;

  if(audio && audio.file_url){
    body += `<div style="background:var(--accent-light);padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border)">
      <div style="width:22px;height:22px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-player-play" style="font-size:11px;color:#fff"></i></div>
      <span style="font-size:11px;color:var(--accent);font-weight:500">Оригінальне аудіо</span>
      <audio controls style="height:24px;flex:1" src="${escapeHtml(audio.file_url)}" id="dlgAudio"></audio>
    </div>`;
  }

  let dlg = audio ? audio.dialogue : null;
  if(typeof dlg === 'string'){ try{ dlg = JSON.parse(dlg); }catch(e){ dlg = null; } }

  body += `<div style="padding:10px 12px;display:flex;flex-direction:column;gap:8px">`;
  if(Array.isArray(dlg) && dlg.length){
    dlg.forEach(line=>{
      const isClient = /клієнт|client/i.test(line.speaker||'');
      if(isClient){
        body += `<div style="display:flex;flex-direction:column;align-items:flex-end">
          <div style="font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${escapeHtml(line.speaker||'Клієнт')}</div>
          <div style="max-width:78%;background:var(--accent);padding:6px 9px;border-radius:7px 0 7px 7px;font-size:11px;line-height:1.5;color:#fff">${escapeHtml(line.text||'')}</div>
        </div>`;
      } else {
        body += `<div>
          <div style="font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px">${escapeHtml(line.speaker||'Персонал')}</div>
          <div style="max-width:78%;background:var(--bg3);padding:6px 9px;border-radius:0 7px 7px 7px;font-size:11px;line-height:1.5;color:var(--text)">${escapeHtml(line.text||'')}</div>
        </div>`;
      }
    });
  } else {
    body += `<div>
      <div style="font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px">Цитата (таймкод ${criterion.timestamp_start ?? '—'}с)</div>
      <div style="max-width:100%;background:var(--bg3);padding:6px 9px;border-radius:0 7px 7px 7px;font-size:11px;line-height:1.5;color:var(--text)">${escapeHtml(criterion.ai_quote)}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px;font-style:italic">Повна діаризація діалогу для цього запису ще не збережена в базі -- показана лише сама цитата.</div>
    </div>`;
  }
  body += `</div>`;

  document.getElementById('dialogPanel').innerHTML = body;
  const dlgAudio = document.getElementById('dlgAudio');
  if(dlgAudio && criterion.timestamp_start!==null && criterion.timestamp_start!==undefined){
    dlgAudio.addEventListener('loadedmetadata', ()=>{ dlgAudio.currentTime = Number(criterion.timestamp_start); });
  }
}

// ============================================================
// ЕКРАН 3: Покупці (1:1 картки з ТЗ)
// ============================================================
async function loadShoppers(){
  document.getElementById('shoppersWrap').innerHTML = '<div class="loading">Завантаження…</div>';
  const r = await api('/ga/supervisor/shoppers/pending');
  if(!r.data.success){
    document.getElementById('shoppersWrap').innerHTML = '<div class="empty-state">Помилка: '+escapeHtml(r.data.error||'невідома')+'</div>';
    return;
  }
  const list = r.data.shoppers;
  [document.getElementById('pendingBadge'), document.getElementById('pendingBadge2')].forEach(b=>{
    if(list.length){ b.style.display='inline'; b.textContent = list.length; } else { b.style.display='none'; }
  });

  if(!list.length){
    document.getElementById('shoppersWrap').innerHTML = '<div class="empty-state">Нових заявок на верифікацію немає.</div>';
    return;
  }

  let html = '<div style="display:flex;gap:14px;flex-wrap:wrap">';
  list.forEach(u=>{
    const genderTxt = u.gender === 'male' ? 'Чоловіча' : (u.gender === 'female' ? 'Жіноча' : (u.gender || ''));
    const metaParts = [u.city, genderTxt, u.age ? u.age+' р.' : ''].filter(Boolean).join(' · ');
    // ТЗ малює просто іконку-плейсхолдер "Фото для верифікації" -- показуємо реальне фото
    // заявника, коли воно є (інакше та сама іконка), бо інакше кнопка "Підтвердити"
    // не має сенсу для реальної верифікації особи
    const photoBlock = u.photo_url
      ? `<img src="${escapeHtml(u.photo_url)}" style="width:80px;height:80px;border-radius:8px;object-fit:cover;border:0.5px solid var(--border);display:block">`
      : `<div style="width:80px;height:80px;border-radius:8px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center"><i class="ti ti-photo" style="font-size:28px;color:var(--muted)"></i></div>`;

    html += `<div style="flex:1;min-width:220px;border:0.5px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="background:var(--warn-bg);padding:6px 12px;border-bottom:0.5px solid var(--warn-border);display:flex;align-items:center;gap:6px">
        <i class="ti ti-clock" style="font-size:13px;color:var(--warn-text)"></i>
        <span style="font-size:11px;color:var(--warn-text);font-weight:500">Очікує верифікації</span>
      </div>
      <div style="padding:14px">
        <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">
          <div style="width:52px;height:52px;border-radius:8px;background:var(--accent-light);border:0.5px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="ti ti-user" style="font-size:24px;color:var(--accent)"></i>
          </div>
          <div>
            <div style="font-size:13px;font-weight:500;color:var(--black);margin-bottom:3px">${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</div>
            <div style="font-size:11px;color:var(--muted)">${escapeHtml(metaParts)}</div>
            <div style="font-size:11px;color:var(--muted)">${escapeHtml(u.email)}</div>
          </div>
        </div>
        <div style="border-top:0.5px solid var(--border);padding-top:10px;margin-bottom:12px">
          <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">Фото для верифікації</div>
          ${photoBlock}
        </div>
        <div style="display:flex;gap:8px">
          <div style="flex:1;height:30px;background:var(--success-bg);border:0.5px solid var(--success-border);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--success);cursor:pointer" onclick="verifyShopper(${u.id},'approve')"><i class="ti ti-check" style="font-size:13px"></i> Підтвердити</div>
          <div style="flex:1;height:30px;background:var(--danger-bg);border:0.5px solid var(--danger-border);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--danger);cursor:pointer" onclick="verifyShopper(${u.id},'reject')"><i class="ti ti-x" style="font-size:13px"></i> Відхилити</div>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('shoppersWrap').innerHTML = html;
}

async function verifyShopper(userId, action){
  if(action==='reject' && !confirm('Відхилити заявку? Запис буде видалено, повторна реєстрація тим самим email залишиться можливою.')) return;
  const r = await api('/ga/supervisor/shoppers/verify', {method:'POST', body: JSON.stringify({user_id:userId, action})});
  if(!r.data.success){ alert('Помилка: '+(r.data.error||'невідома')); return; }
  loadShoppers();
}

loadReviews();
loadShoppers();
</script>
</body>
</html>
